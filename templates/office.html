<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Office</title>
<style>body{font-family:system-ui;padding:1rem}input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:8px}</style></head>
<body><a href="/home">← Back</a><h3>Office & Stationery</h3>
<input type="date" id="date"><input id="item" placeholder="Item (Cartridge, Paper...)"><input type="number" id="qty" placeholder="Quantity" value="1"><input type="number" id="amount" placeholder="Amount"><input id="vendor" placeholder="Vendor"><input id="remarks" placeholder="Remarks">
<button onclick="save()">Save</button>
<script>
document.getElementById('date').valueAsDate=new Date();
function save(){
  fetch('/api/save-office',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    date:document.getElementById('date').value, item:document.getElementById('item').value,
    qty:document.getElementById('qty').value, amount:document.getElementById('amount').value,
    vendor:document.getElementById('vendor').value, remarks:document.getElementById('remarks').value
  })}).then(()=>{alert('Saved');location.href='/home'});
}
</script></body></html>
