<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Manager - Login</title>
<style>
body { font-family: system-ui, sans-serif; background:#f5f5f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
.card { background:white; padding:2rem; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:90%; max-width:360px; }
h2 { text-align:center; color:#1a73e8; margin-bottom:1.5rem; }
input { width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; }
button { width:100%; padding:12px; background:#1a73e8; color:white; border:none; border-radius:8px; font-size:16px; margin-top:10px; }
.error { color:red; text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div class="card">
  <h2>Campaign Manager</h2>
  <input type="text" id="userid" placeholder="User ID" autocomplete="username">
  <input type="password" id="password" placeholder="Password" autocomplete="current-password">
  <button onclick="login()">Login</button>
  <div id="error" class="error"></div>
</div>
<script>
async function login() {
  const userid = document.getElementById('userid').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({userid, password})
  });
  const data = await res.json();
  if (data.success) {
    window.location = '/home';
  } else {
    document.getElementById('error').innerText = data.message || 'Login failed';
  }
}
</script>
</body>
</html>
