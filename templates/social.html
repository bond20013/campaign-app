<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Social Media</title>
<style>body{font-family:system-ui;padding:1rem}input,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}button{width:100%;padding:12px;background:#1a73e8;color:#fff;border:none;border-radius:8px}</style></head>
<body><a href="/home">← Back</a><h3>Social Media Expense</h3>
<input type="date" id="date">
<select id="platform"><option>Facebook</option><option>Instagram</option><option>YouTube</option><option>WhatsApp</option><option>Other</option></select>
<input id="desc" placeholder="Description"><input id="vendor" placeholder="Vendor / Agency"><input type="number" id="amount" placeholder="Amount">
<button onclick="save()">Save</button>
<script>
document.getElementById('date').valueAsDate=new Date();
function save(){
  fetch('/api/save-social',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    date:document.getElementById('date').value, platform:document.getElementById('platform').value,
    desc:document.getElementById('desc').value, vendor:document.getElementById('vendor').value, amount:document.getElementById('amount').value
  })}).then(()=>{alert('Saved');location.href='/home'});
}
</script></body></html>
